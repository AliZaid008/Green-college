<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المبنى الحي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=El+Messiri:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: an architect's working sheet. The floor plan is the home page; every other view hangs off it. */
:root{
  --paper:#f2f5f0; --surface:#ffffff; --sunk:#e8ede7; --ink:#12261f; --muted:#586b62; --line:#d3dcd5;
  --accent:#0d7556; --accent-ink:#ffffff; --accent-soft:#dcefe7;
  --energy:#b56f06; --clean:#c8481f; --waste:#7d5236; --smart:#2a66a8;
  --good:#1f7a3d; --warn:#a86400; --bad:#b3261e;
  --display:"El Messiri","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0d1613; --surface:#14201c; --sunk:#0a120f; --ink:#e4eee8; --muted:#93a79d; --line:#27382f;
    --accent:#3dbf93; --accent-ink:#06231a; --accent-soft:#17352b;
    --energy:#e5a23a; --clean:#f0825c; --waste:#c79a7c; --smart:#74a9e6;
    --good:#5fcf85; --warn:#e5a23a; --bad:#f2817a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0d1613; --surface:#14201c; --sunk:#0a120f; --ink:#e4eee8; --muted:#93a79d; --line:#27382f;
  --accent:#3dbf93; --accent-ink:#06231a; --accent-soft:#17352b;
  --energy:#e5a23a; --clean:#f0825c; --waste:#c79a7c; --smart:#74a9e6;
  --good:#5fcf85; --warn:#e5a23a; --bad:#f2817a;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
h1,h2,h3{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance;font-weight:700}
h1{font-size:1.5rem} h2{font-size:1.35rem} h3{font-size:1.05rem;font-weight:500}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.muted{color:var(--muted)}
.small{font-size:.875rem}

header.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:10px;align-items:center;margin-inline-end:auto}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font-family:var(--display);font-size:1.3rem;display:block;line-height:1.1}
.brand span{font-size:.8rem;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.95rem}
nav a:hover{color:var(--ink);background:var(--sunk)}
nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.875rem}
.ghost:hover{border-color:var(--ink)}

main{max-width:1120px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:22px}
section.view{display:none;flex-direction:column;gap:20px}
section.view.on{display:flex}
.lede{max-width:65ch;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:2px}
.tile .v{font-family:var(--mono);font-size:1.6rem;font-weight:500;direction:ltr;unicode-bidi:isolate;text-align:start}
.tile .k{font-size:.85rem;color:var(--muted)}

.plan{width:100%;overflow-x:auto}
.plan svg{display:block;width:100%;min-width:560px;height:auto}
.room rect{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.room{cursor:pointer}
.room:hover rect,.room:focus-visible rect{stroke:var(--accent);stroke-width:3}
.room .heat{fill:var(--accent);stroke:none;pointer-events:none}
.room text{fill:var(--ink);font-family:var(--body);font-size:13px;pointer-events:none}
.room text.sm{font-size:10.5px}
.room.garden rect:not(.heat){stroke:var(--good);stroke-dasharray:6 4;fill:color-mix(in srgb,var(--good) 14%,var(--surface))}
.room .pin{fill:var(--ink)} .room .pint{fill:var(--paper);font-family:var(--mono);font-size:11px}
.dim{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 4;fill:none}
.dimt{fill:var(--muted);font-family:var(--mono);font-size:10px}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:500;border:1px solid var(--line);background:var(--surface);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:2px;display:inline-block}
.t-energy i,.bar-energy{background:var(--energy)} .t-clean i,.bar-clean{background:var(--clean)}
.t-waste i,.bar-waste{background:var(--waste)} .t-smart i,.bar-smart{background:var(--smart)}
.pill{border-radius:6px;padding:2px 9px;font-size:.8rem;font-weight:600;white-space:nowrap}
.s-open{background:var(--accent-soft);color:var(--accent)}
.s-reserved{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.s-approved{background:color-mix(in srgb,var(--smart) 18%,transparent);color:var(--smart)}
.s-done{background:var(--good);color:var(--surface)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,input[type=text],input[type=search],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:92px;resize:vertical}
label{font-size:.875rem;font-weight:500;display:flex;flex-direction:column;gap:4px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{filter:brightness(1.08)} .btn:disabled{opacity:.5;cursor:default}
.btn.alt{background:none;color:var(--ink);border:1px solid var(--ink)}
.btn.sm{padding:5px 11px;font-size:.875rem}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:9px;border-inline-start:4px solid var(--line)}
.card.k-energy{border-inline-start-color:var(--energy)} .card.k-clean{border-inline-start-color:var(--clean)}
.card.k-waste{border-inline-start-color:var(--waste)} .card.k-smart{border-inline-start-color:var(--smart)}
.card .head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card .id{font-family:var(--mono);font-size:.8rem;color:var(--muted);direction:ltr}
.card .meta{display:flex;gap:6px;flex-wrap:wrap}
.card details{border-top:1px dashed var(--line);padding-top:8px}
.card summary{cursor:pointer;font-size:.875rem;font-weight:500;color:var(--accent)}
.card dl{margin:8px 0 0;display:grid;gap:6px;font-size:.9rem}
.card dt{font-weight:600;font-size:.8rem;color:var(--muted)} .card dd{margin:0}
.steps{display:flex;gap:4px;flex-wrap:wrap;font-size:.75rem;margin-top:8px}
.steps span{padding:2px 8px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.steps span.on{background:var(--ink);color:var(--paper)}
.est{font-size:.9rem}

.pipeline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:560px){.pipeline{grid-template-columns:1fr 1fr}}
.pipeline div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.85rem;background:var(--sunk);color:var(--muted)}
.pipeline div.on{background:var(--accent-soft);color:var(--ink);border-color:var(--accent)}
.pipeline b{display:block;font-family:var(--mono);font-size:.75rem;direction:ltr;text-align:start}
.note{border-inline-start:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);padding:8px 12px;border-radius:6px;font-size:.9rem}
.note.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.note.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;flex:1;min-width:120px}
.meter i{display:block;height:100%;background:var(--accent)}

.modes{display:flex;gap:6px;flex-wrap:wrap}
.modes button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:500}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chat{display:flex;flex-direction:column;gap:10px;min-height:220px;max-height:52vh;overflow-y:auto;padding:4px}
.msg{max-width:82%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--paper);border-end-end-radius:3px}
.msg.a{align-self:flex-start;background:var(--sunk);border-end-start-radius:3px}
.compose{display:flex;gap:8px}
.compose textarea{min-height:48px;flex:1}
.starters{display:flex;gap:6px;flex-wrap:wrap}
.starters button{border:1px dashed var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:.85rem}
.starters button:hover{border-color:var(--accent);color:var(--accent)}

.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(60px,1fr) 44px;gap:10px;align-items:center;font-size:.9rem}
.barrow .chip{white-space:normal;border-radius:8px}
@media (max-width:560px){.barrow{grid-template-columns:1fr;gap:2px}}
.track{height:16px;background:var(--sunk);border-radius:4px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.seg-res{background:var(--warn)} .seg-done{background:var(--good)} .seg-open{background:var(--line)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:start;padding:7px 8px;border-bottom:1px solid var(--line)}
th{font-size:.8rem;color:var(--muted);font-weight:600}
td.n,th.n{font-family:var(--mono);direction:ltr;text-align:end}
.tw{overflow-x:auto}
.road{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.road div{border:1px dashed var(--line);border-radius:var(--r);padding:12px}
.road b{display:block;font-family:var(--display);font-weight:500}
#toast{position:fixed;inset-block-end:18px;inset-inline:0;margin:auto;width:max-content;max-width:90vw;background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.plan-sec{display:flex;flex-direction:column;gap:10px}
.plan-sec h3{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.plan-sec h3 small{font-family:var(--body);font-size:.85rem;color:var(--muted);font-weight:400}
.prow{display:grid;grid-template-columns:42px minmax(0,1fr) 120px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.prow .rk{font-family:var(--display);font-size:1.6rem;color:var(--accent);text-align:center}
.prow .why{font-size:.88rem;color:var(--muted)}
.prow .sc{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.letter{border:1px solid var(--line);border-inline-start:4px solid var(--accent);border-radius:8px;padding:14px 16px;background:var(--sunk);white-space:pre-wrap}
@media print{header.top,footer,#toast,.noprint{display:none!important}section.view{display:none!important}section.view.on{display:flex!important}body{background:#fff}.panel{border:0}}
.gate{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:16px}
.gate .box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}
.gate .box svg{width:46px;height:46px}
footer{max-width:1120px;margin:0 auto;padding:0 16px 30px;color:var(--muted);font-size:.8rem}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="6" y="12" width="20" height="24" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 24h20M16 12v24" stroke="currentColor" stroke-width="1.2"/><path d="M26 22c0-8 4-13 11-14 0 8-3 13-11 14z" fill="var(--accent)"/><path d="M26 22v14" stroke="var(--accent)" stroke-width="2"/></svg>
      <div><b data-i="name"></b><span data-i="tag"></span></div>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
    <span class="chip" id="roleChip" hidden></span><select id="viewAs" class="noprint" hidden aria-label="View as"></select><button class="ghost" id="signOut" type="button" hidden></button><button class="ghost" id="langBtn" type="button"></button>
  </div>
</header>

<main>
  <!-- BUILDING -->
  <section class="view" id="v-building">
    <div class="stack"><h1 data-i="b_h"></h1><p class="lede" data-i="b_lede"></p></div>
    <div class="tiles" id="tiles"></div>
    <div class="grid2">
      <div class="panel stack">
        <div class="row" style="justify-content:space-between"><h2 data-i="plan_h"></h2><span class="chip muted" data-i="plan_sample"></span></div>
        <div class="plan" id="plan"></div>
        <p class="small muted" data-i="plan_hint"></p>
      </div>
      <div class="panel stack">
        <h2 data-i="tracks_h"></h2>
        <div class="bars" id="trackBars"></div>
        <h3 data-i="loud_h" style="margin-top:8px"></h3>
        <div class="tw"><table id="loud"></table></div>
        <a class="btn" href="#voice" data-i="cta_report" style="text-decoration:none;text-align:center"></a>
      </div>
    </div>
  </section>

  <!-- VOICE + FACTORY -->
  <section class="view" id="v-voice">
    <div class="stack"><h1 data-i="v_h"></h1><p class="lede" data-i="v_lede"></p></div>
    <div class="grid2">
      <form class="panel stack" id="reportForm">
        <div class="modes" role="group">
          <button type="button" id="kProblem" aria-pressed="true" data-i="k_problem"></button>
          <button type="button" id="kIdea" aria-pressed="false" data-i="k_idea"></button>
        </div>
        <label><span id="txtLabel"></span><textarea id="rText" required maxlength="600"></textarea></label>
        <label><span data-i="place"></span><select id="rRoom"></select></label>
        <div class="row"><button class="btn" id="rSend" type="submit" data-i="send_factory"></button><span class="small muted" id="rBusy"></span></div>
        <p class="small muted" data-i="rule"></p>
      </form>
      <div class="panel stack" id="factoryOut">
        <h2 data-i="factory_h"></h2>
        <div class="pipeline" id="pipe"></div>
        <div id="result" class="stack"><p class="muted" data-i="factory_empty"></p></div>
      </div>
    </div>
  </section>

  <!-- CATALOGUE -->
  <section class="view" id="v-catalogue">
    <div class="stack"><h1 data-i="c_h"></h1><p class="lede" data-i="c_lede"></p></div>
    <div class="filters">
      <input type="search" id="fQ">
      <select id="fTrack"></select><select id="fSize"></select><select id="fStatus"></select><select id="fRoom"></select>
      <span class="small muted" id="fCount"></span>
    </div>
    <div class="cards" id="cards"></div>
  </section>

  <!-- ADVISOR -->
  <section class="view" id="v-advisor">
    <div class="stack"><h1 data-i="a_h"></h1><p class="lede" data-i="a_lede"></p></div>
    <div class="modes" role="group" id="modes"></div>
    <div class="panel stack">
      <p class="small muted" id="modeNote"></p>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="starters" id="starters"></div>
      <form class="compose" id="chatForm">
        <textarea id="cText" rows="2"></textarea>
        <div class="stack"><button class="btn" id="cSend" type="submit" data-i="send"></button><button class="btn alt sm" id="cStop" type="button" hidden data-i="stop"></button></div>
      </form>
      <div class="row" id="chatTools">
        <button class="btn alt sm" id="cPublish" type="button" data-i="publish"></button>
        <button class="ghost" id="cClear" type="button" data-i="clear"></button>
      </div>
      <div id="whatif"></div>
    </div>
  </section>

  <!-- DEAN -->
  <section class="view" id="v-dean">
    <div class="stack"><h1 data-i="dn_h"></h1><p class="lede" data-i="dn_lede"></p></div>
    <p class="note noprint" id="dReadonly" hidden></p>
    <div class="panel row noprint" style="justify-content:space-between">
      <div class="row" id="dSizes">
        <label><span data-i="dn_grad"></span><select id="dGrad"></select></label>
        <label><span data-i="dn_assign"></span><select id="dAssign"></select></label>
      </div>
      <div class="row">
        <button class="btn" id="dEndorse" type="button" data-i="dn_endorse"></button><button class="btn" id="dLetter" type="button" data-i="dn_ai"></button>
        <button class="btn alt sm" id="dCopy" type="button" data-i="dn_copy"></button>
        <button class="ghost" id="dPrint" type="button" data-i="dn_print"></button>
      </div>
    </div>
    <p class="note ok" id="dBadge" hidden></p>
    <div class="tiles" id="dTiles"></div>
    <div class="panel stack" id="dLetterBox" hidden><h2 data-i="dn_letter_h"></h2><div class="letter" id="dLetterText"></div><p class="small muted" data-i="dn_letter_note"></p></div>
    <div class="grid2">
      <div class="panel stack" id="dMain"></div>
      <div class="panel stack" id="dQuick"></div>
    </div>
    <p class="small muted" data-i="dn_rule"></p>
  </section>

  <!-- IMPACT -->
  <section class="view" id="v-impact">
    <div class="stack"><h1 data-i="i_h"></h1><p class="lede" data-i="i_lede"></p></div>
    <div class="panel stack">
      <h2 data-i="i_pot"></h2>
      <div class="tw"><table id="impactTable"></table></div>
      <p class="small muted" data-i="est_note"></p>
    </div>
    <div class="grid2">
      <div class="panel stack"><h2 data-i="i_flow"></h2><div class="bars" id="flowBars"></div>
        <div class="row small muted"><span class="chip"><i class="seg-open"></i><span data-i="st_open"></span></span><span class="chip"><i class="seg-res"></i><span data-i="st_reserved"></span></span><span class="chip"><i class="seg-done"></i><span data-i="st_done"></span></span></div>
      </div>
      <div class="panel stack"><h2 data-i="i_next"></h2><div class="road" id="road"></div></div>
    </div>
  </section>
</main>
<footer><span data-i="foot"></span> <span id="modeFoot"></span></footer>
<div id="toast" role="status"></div>
<div class="gate" id="gate" hidden>
  <form class="box" id="gateForm">
    <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="6" y="12" width="20" height="24" fill="none" stroke="currentColor" stroke-width="2"/><path d="M6 24h20M16 12v24" stroke="currentColor" stroke-width="1.2"/><path d="M26 22c0-8 4-13 11-14 0 8-3 13-11 14z" fill="var(--accent)"/><path d="M26 22v14" stroke="var(--accent)" stroke-width="2"/></svg>
    <h2 data-i="auth_h"></h2><p class="muted" id="gateText"></p>
    <label><span data-i="auth_email"></span><input type="text" id="gateEmail" inputmode="email" autocomplete="email" dir="ltr" required></label>
    <button class="btn" id="gateSend" type="submit" data-i="auth_send"></button>
    <p class="small" id="gateMsg" role="status"></p>
    <button class="ghost" id="gateLang" type="button"></button>
  </form>
</div>

<script>
"use strict";
/* ---------- text ---------- */
const T={
name:["المبنى الحي","Living Building"],

  if(statusOf(id)!=="open")return toast(t("taken"));

/* ---------- similarity (local, no AI) ---------- */
const STOP=new Set("the a an of to in on at for and or is are be it its this that with by from as into than then so no not all any each per who what when which while their there after before can cannot nobody every في من على الى إلى عن مع او أو ان أن كل هذا هذه ذلك التي الذي لا ما هو هي كان يكون بعد قبل عند حتى ثم لان لأن بلا دون مهما".split(" ").map(norm1));
function norm1(w){return w.toLowerCase().replace(/[ً-ْـ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي")}
function stem(w){if(/[؀-ۿ]/.test(w)){w=w.replace(/^(وال|بال|كال|فال|لل|ال)/,"");if(w.length>3)w=w.replace(/^[وفبل]/,"");if(w.length>4)w=w.replace(/(ات|ون|ين|ها|هم|يه|ه|ي)$/,"")}else{if(w.length>5)w=w.replace(/(ing|ers|er|ed|es|s)$/,"");else if(w.length>3)w=w.replace(/s$/,"")}return w}
function toks(s){return norm1(String(s)).split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>1&&!STOP.has(w)).map(stem).filter(w=>w.length>1)}
const ideaText=i=>[i.title.ar,i.title.en,i.problem.ar,i.problem.en,i.method.ar,i.method.en].join(" ");
function similar(text,list,skip){
  const docs=list.filter(i=>i.id!==skip).map(i=>({i,tk:toks(ideaText(i))}));const N=docs.length+1,df=new Map();
  docs.forEach(d=>new Set(d.tk).forEach(w=>df.set(w,(df.get(w)||0)+1)));
  const idf=w=>Math.log(1+N/(1+(df.get(w)||0)));
  const vec=tk=>{const m=new Map();tk.forEach(w=>m.set(w,(m.get(w)||0)+1));let n=0;m.forEach((v,w)=>{const x=(1+Math.log(v))*idf(w);m.set(w,x);n+=x*x});return{m,n:Math.sqrt(n)||1}};
  const q=vec(toks(text));let best=null,score=0,qsum=0;q.m.forEach(x=>qsum+=x);
  docs.forEach(d=>{const v=vec(d.tk);let dot=0,hit=0;q.m.forEach((x,w)=>{const y=v.m.get(w);if(y){dot+=x*y;hit+=x}});const sc=.5*dot/(q.n*v.n)+.5*(qsum?hit/qsum:0);if(sc>score){score=sc;best=d.i}});
  return{idea:best,score}
}

function loose(text){try{return JSON.parse(text)}catch(e){}const a=text.indexOf("{"),b=text.lastIndexOf("}");if(a>=0&&b>a)return JSON.parse(text.slice(a,b+1));throw{code:"invalid_json"}}
async function selfHost(messages,json,signal){const h={"content-type":"application/json"};if(store.token)h.authorization="Bearer "+store.token;const r=await fetch("api/ai",{method:"POST",headers:h,body:JSON.stringify({messages,json:!!json}),signal});if(!r.ok)throw{code:r.status===429?"rate_limited":"upstream_error"};const j=await r.json();return String(j.text||"")}
async function aiJSON(prompt){if(AI.sample)return AI.sample.json(prompt,{modelTier:"quick",cache:false});if(!HOSTED)return loose(await selfHost([{role:"user",content:prompt}],true));throw{code:"not_granted"}}

const CONTEXT=`Living Building (المبنى الحي) is a platform of the College of Artificial Intelligence, University of Baghdad. The college occupies the second floor of a building it shares with another college. Every idea must make this building more sustainable, and student course or graduation projects are how the work gets done.
Tracks: energy = rationing and managing energy use; clean = clean and renewable energy; waste = waste management and recycling; smart = smart sustainable building technology (also water, comfort, maintenance).
The floor has a wide corridor on one side, a corridor along the top and one down the other side that widens near the main hall, with an open area of green plants in the middle. Place ids: h1 h2 h3 h4 h5 classrooms; hall the main hall where all departments share lessons; lab1 to lab7 computer labs; offN and offE rows of individual offices for department heads and professors; dean dean's office; asst assistant dean; exam exam unit; staff shared professors' room; expo exhibition room where students show projects and robots at events; pray prayer room; cafe cafeteria; garden the green plants area in the middle of the floor; wc1 wc2 wc3 bathrooms; corr corridors; stairs; roof; yard shared entrance and garden; all whole floor.`;
const CARD_JSON=`{"on_topic":true,"size":"assign","track":"energy","room":"h1","metric":"kwh","est":1200,"title":{"ar":"","en":""},"problem":{"ar":"","en":""},"method":{"ar":"","en":""},"data":{"ar":"","en":""},"tie":{"ar":"","en":""}}`;
const CARD_RULES=`Card rules: size "fix" = a maintenance job with no research in it; "assign" = a course assignment of two to four weeks; "grad" = a graduation project. metric is the one number the project aims to change per year: "kwh" electricity, "l" litres of water, "kg" waste. est is a cautious rough yearly figure as an integer; prefer low. title is at most 6 words. problem, method (which AI or data technique and what it does) and data (what to collect) are one short sentence each. Write Arabic in clear Modern Standard Arabic and English in plain English. If the text is not about making this building more sustainable, set on_topic false, still write the card as the closest version that IS tied to a place in the building and a measurable number, and explain that link in one sentence in "tie"; otherwise leave "tie" strings empty.
Reply with only JSON in exactly this shape: ${CARD_JSON}`;
function localCard(text,room,kind){
  const x=norm1(text);const has=(...w)=>w.some(k=>x.includes(norm1(k)));
  let track="smart",metric="kwh",est=500;
  if(has("شمس","solar","لوح","panel","متجدد","renewable","مولد","generator")){track="clean";est=1500}
  else if(has("نفاي","waste","قنين","قناني","bottle","ورق","paper","بلاستك","بلاستيك","plastic","تدوير","recycl","حاوي","bin")){track="waste";metric="kg";est=80}
  else if(has("ماء","مياه","water","حنفي","tap","تسرب","leak","يقطر","drip")){track="smart";metric="l";est=15000}
  else if(has("كهرب","electric","انار","light","مكيف","تبريد","cool","ac ","طاق","energy","حاسوب","حاسب","computer")){track="energy";est=1000}
  const size=kind==="idea"?"assign":(has("مكسور","عطل","broken","يقطر","drip")?"fix":"assign");
  const short=text.trim().split(/\s+/).slice(0,6).join(" ");
  return{on_topic:true,size,track,room,metric,est,title:{ar:short,en:short},problem:{ar:text.trim(),en:text.trim()},method:{ar:"تُحدَّد الطريقة مع المشرف.",en:"Method to be agreed with a supervisor."},data:{ar:"قياس الوضع الحالي لمدة أسبوعين.",en:"Two weeks of baseline measurements."},tie:{ar:"",en:""}}
}

  return`${CONTEXT}\n\nYou are the green project advisor of this platform. You help a student shape a course or graduation project that makes the building more sustainable. Whatever they propose, make sure two things get answered before you call the idea ready: (1) how does it reduce this building's electricity, water, or waste, and in which place; (2) how will they measure the change. If the idea is unrelated to the building, do not reject it: suggest how to tie it to a place and a number. Point to similar catalogue ideas by number when relevant, and tell them if an idea is already reserved. Suggest a free or low-cost way to do things. Reply in the user's language (Arabic or English), in 2-5 short sentences, plain text, no markdown.\n\nCatalogue: ${data}`
}

      whatif={...w,q:text}}catch(e){toast(aiMsg(e))}
    whatBusy=false;renderWhat();return}
  const list=chats[mode];list.push({role:"user",content:text});renderAdvisor();
  const c=$("chat"),b=document.createElement("div");b.className="msg a";b.textContent=t("thinking");c.appendChild(b);c.scrollTop=c.scrollHeight;
  ctl=new AbortController();$("cStop").hidden=false;$("cSend").disabled=true;
  try{const ans=await aiChat([{role:"user",content:rules()},...list.slice(-12)],x=>{b.textContent=x;c.scrollTop=c.scrollHeight},ctl.signal);list.push({role:"assistant",content:ans})}
  catch(e){if(e&&e.code==="cancelled"&&e.text)list.push({role:"assistant",content:e.text});else{b.remove();if(!(e&&e.code==="cancelled"))toast(aiMsg(e))}}
  $("cStop").hidden=true;$("cSend").disabled=false;renderAdvisor()
}
async function publishChat(){
  const list=chats.adv;if(!list.some(m=>m.role==="user"))return toast(t("need_chat"));
  const talk=list.map(m=>(m.role==="user"?"Student: ":"Advisor: ")+m.content).join("\n").slice(-6000);
  location.hash="voice";busy=true;draft=null;renderResult();
  let card=null,basic=false;
  try{card=await aiJSON(`${CONTEXT}\n\nBelow is a private conversation between a student and the project advisor. Write the student's final idea as one project card.\n"""${talk}"""\n${CARD_RULES}`)}catch(e){toast(aiMsg(e))}
  if(!card||typeof card!=="object"){card=localCard(list.filter(m=>m.role==="user").map(m=>m.content).join(" ").slice(0,300),"all","idea");basic=true}
  buildDraft(card,basic);busy=false;renderResult()
}

/* ---------- dean plan ---------- */
const DP={grad:4,assign:4,letter:null,why:{},busy:false,endorsed:0};
function planData(){
  const live=ideas().filter(i=>statusOf(i.id)!=="done");
  const mx={kwh:1,l:1,kg:1};ideas().forEach(i=>{mx[i.metric]=Math.max(mx[i.metric],i.est)});
  const score=i=>.7*(Math.log(1+i.est)/Math.log(1+mx[i.metric]))+.3*Math.min(1,(reportsOf(i.id)-1)/4);
  const rank=l=>l.map(i=>({i,s:score(i)})).sort((a,b)=>b.s-a.s);
  const quick=rank(live.filter(i=>i.size==="fix")),assign=rank(live.filter(i=>i.size==="assign")).slice(0,DP.assign),grad=rank(live.filter(i=>i.size==="grad")).slice(0,DP.grad);
  const all=[...quick,...assign,...grad],tot={kwh:0,l:0,kg:0};all.forEach(x=>tot[x.i.metric]+=x.i.est);
  return{quick,assign,grad,all,tot}
}
function planRows(list,start){
  if(!list.length)return`<p class="small muted">${esc(t("dn_none"))}</p>`;
  return list.map((x,k)=>{const i=x.i,s=statusOf(i.id),why=DP.why[i.n];
    return`<div class="prow"><span class="rk">${start+k}</span><div><b>${esc(bi(i.title))}</b> <span class="small muted num">#${i.n}</span>
    <div class="meta" style="display:flex;gap:6px;flex-wrap:wrap;margin:4px 0">${chipT(i.track)}<span class="chip">${esc(roomName(i.room))}</span>${s!=="open"?`<span class="pill s-${s}">${esc(t("dn_inprog"))}</span>`:""}</div>
    <div class="why">${esc(why?bi(why):t("dn_why",{e:fmt(i.est)+" "+t("m_"+i.metric),r:reportsOf(i.id),p:roomName(i.room)}))}</div></div>
    <div class="sc"><span>${esc(t("dn_score"))}</span><div class="meter"><i style="width:${Math.round(x.s*100)}%"></i></div></div></div>`}).join("")
}
function renderDean(){
  const opt=(n,sel)=>`<option value="${n}"${n===sel?" selected":""}>${n}</option>`;
  $("dGrad").innerHTML=[2,3,4,5,6,8].map(n=>opt(n,DP.grad)).join("");$("dAssign").innerHTML=[2,3,4,5,6,8].map(n=>opt(n,DP.assign)).join("");
  const d=planData();
  const all=ideas(),prog=all.filter(i=>["reserved","approved"].includes(statusOf(i.id))).length,done=all.filter(i=>statusOf(i.id)==="done").length;
  $("dTiles").innerHTML=[[d.all.length,"dn_t_n"],[prog,"dn_t_prog"],[done,"dn_t_done"],[d.tot.kwh,"dn_t_kwh"],[d.tot.l,"dn_t_l"],[d.tot.kg,"dn_t_kg"]].map(([v,k])=>`<div class="tile"><span class="v">${fmt(v)}</span><span class="k">${esc(t(k))}</span></div>`).join("");
  const sec=(h,sub,list,start)=>`<div class="plan-sec"><h3>${esc(t(h))} <small>${esc(t(sub))}</small></h3>${planRows(list,start)}</div>`;
  $("dMain").innerHTML=sec("dn_gradh","dn_grad_s",d.grad,1)+sec("dn_sem","dn_sem_s",d.assign,d.grad.length+1);
  $("dQuick").innerHTML=sec("dn_quick","dn_quick_s",d.quick,d.grad.length+d.assign.length+1);
  $("dLetterBox").hidden=!(DP.letter||DP.busy);$("dLetterText").textContent=DP.busy?t("dn_writing"):bi(DP.letter);
  $("dLetter").disabled=DP.busy;
  const sup=roleNow()==="supervisor";
  $("dSizes").hidden=!sup;$("dLetter").hidden=!aiOn()||!sup;
  $("dReadonly").hidden=false;$("dReadonly").className="note noprint"+(isDean()?" ok":"");
  $("dReadonly").textContent=isDean()?t("dn_vip"):sup?t("dn_staffnote"):t("dn_ro");
  $("dEndorse").hidden=!isDean();$("dEndorse").textContent=DP.endorsed?t("dn_unendorse"):t("dn_endorse");$("dEndorse").className=DP.endorsed?"btn alt sm":"btn";
  const fd=n=>new Date(n).toLocaleDateString(lang==="ar"?"ar-IQ":"en-GB",{day:"numeric",month:"long",year:"numeric"});
  $("dBadge").hidden=!DP.endorsed;if(DP.endorsed)$("dBadge").textContent=t("dn_endorsed",{d:fd(DP.endorsed)});
}
function planText(){
  const d=planData(),L=(x,k)=>`${k}. ${bi(x.i.title)} (#${x.i.n}) · ${roomName(x.i.room)} · ${fmt(x.i.est)} ${t("m_"+x.i.metric)}`;
  let n=1,out=[t("dn_h"),""];
  if(DP.letter)out.push(bi(DP.letter),"");
  [["dn_gradh",d.grad],["dn_sem",d.assign],["dn_quick",d.quick]].forEach(([h,l])=>{out.push(t(h)+":");l.forEach(x=>out.push(L(x,n++)));out.push("")});
  out.push(t("dn_t_kwh")+": "+fmt(d.tot.kwh),t("dn_t_l")+": "+fmt(d.tot.l),t("dn_t_kg")+": "+fmt(d.tot.kg),"",t("dn_rule"));
  return out.join("\n")
}
async function writeLetter(){
  if(!aiOn())return toast(t("ai_off"));
  const d=planData(),items=d.all.map(x=>({n:x.i.n,title:x.i.title.en,size:x.i.size,place:(ROOMS.find(r=>r.id===x.i.room)||{}).en,track:x.i.track,est:x.i.est+" "+x.i.metric+"/year",reports:reportsOf(x.i.id),status:statusOf(x.i.id)}));
  DP.busy=true;renderDean();
  try{const r=await aiJSON(`${CONTEXT}\n\nThis is next year's plan, already ranked by the platform: graduation projects, course projects and quick maintenance fixes.\n${JSON.stringify(items)}\nTotals if carried out: ${d.tot.kwh} kWh, ${d.tot.l} litres, ${d.tot.kg} kg per year (rough estimates).\nWrite (1) a short, respectful letter to the dean of the college presenting this plan: 4 to 6 sentences, what it does, what it costs (mostly student time and supervision), the estimated yearly savings stated as estimates, and the first step to approve; (2) one short sentence per item explaining why it is worth doing now. Arabic in formal Modern Standard Arabic, English in plain English. Reply with only JSON: {"letter":{"ar":"","en":""},"why":[{"n":1,"ar":"","en":""}]}`);
    if(r&&r.letter){DP.letter=two(r.letter);DP.why={};(Array.isArray(r.why)?r.why:[]).forEach(w=>{if(w&&w.n)DP.why[Number(w.n)]=two(w)})}}
  catch(e){toast(aiMsg(e))}
  DP.busy=false;renderDean();savePlan()
}

/* ---------- self-hosted sign-in (Supabase) ---------- */
function supaAdapter(sb){
  const L={},split=p=>{const a=p.split("/");return{c:a[0],i:a[1]}};
  const on=(c,f)=>{(L[c]=L[c]||[]).push(f);f();return()=>{L[c]=L[c].filter(x=>x!==f)}};
  const fire=c=>{(c&&L[c]?[c]:Object.keys(L)).forEach(k=>L[k].forEach(f=>f()))};
  const getDoc=async(c,i)=>{const{data,error}=await sb.from("docs").select("data").eq("coll",c).eq("id",i).maybeSingle();if(error)throw error;return{exists:!!data,data:()=>data?data.data:undefined}};
  return{
    doc(path){const{c,i}=split(path);return{
      get:()=>getDoc(c,i),
      async set(obj){const{error}=await sb.from("docs").upsert({coll:c,id:i,data:obj});if(error)throw error;fire(c)},
      onSnapshot(next,err){return on(c,async()=>{try{next(await getDoc(c,i))}catch(e){err&&err(e)}})}}},
    collection(c){return{onSnapshot(next,err){return on(c,async()=>{const{data,error}=await sb.from("docs").select("id,data").eq("coll",c);if(error){err&&err(error);return}next({docs:data.map(r=>({id:r.id,exists:true,data:()=>r.data}))})})}}},
    start(){sb.channel("lb-docs").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>fire((p.new&&p.new.coll)||(p.old&&p.old.coll))).subscribe();setInterval(()=>fire(),60000)}
  }
}
function loadScript(src){return new Promise((ok,no)=>{const e=document.createElement("script");e.src=src;e.onload=ok;e.onerror=no;document.head.appendChild(e)})}
function attachDB(db){
  store.db=db;added={};st={};apv={};
  const sub=(name,apply)=>db.collection(name).onSnapshot(s=>{const o={};s.docs.forEach(d=>{const v=d.data();if(v)o[d.id]={...v}});apply(o);renderAll()},()=>{});
  sub("ideas",o=>added=o);sub("state",o=>st=o);sub("approvals",o=>apv=o);
  db.doc("deanplan/main").onSnapshot(d=>{if(d.exists&&!DP.busy){applyPlan(d.data());renderAll()}},()=>{})
}
async function supaStart(){
  const cfg=window.LB_CONFIG||{};if(!cfg.supabaseUrl||!cfg.supabaseAnonKey)return;
  try{await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js")}catch(e){toast(t("ai_err"));return}
  const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);store.sb=sb;
  const{data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")location.reload()});
  if(!session){store.role="guest";$("gate").hidden=false;renderAll();return}
  store.uid=session.user.id;store.token=session.access_token;
  sb.auth.onAuthStateChange((ev,se)=>{if(se)store.token=se.access_token});
  const{data:prof}=await sb.from("profiles").select("role").eq("id",session.user.id).maybeSingle();
  store.role=pick(prof&&prof.role,["student","supervisor","dean"],"student");store.preview=null;
  const db=supaAdapter(sb);attachDB(db);db.start();renderAll()
}
$("gateForm").addEventListener("submit",async e=>{
  e.preventDefault();const email=$("gateEmail").value.trim().toLowerCase(),cfg=window.LB_CONFIG||{},msg=$("gateMsg");
  const dom=email.split("@")[1]||"";
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){msg.textContent=t("auth_err");return}
  if((cfg.allowedDomains||[]).length&&!cfg.allowedDomains.includes(dom)){msg.textContent=t("auth_bad");return}
  $("gateSend").disabled=true;
  const{error}=await store.sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  $("gateSend").disabled=false;
  msg.textContent=error?(/not allowed|Database error/i.test(error.message||"")?t("auth_refused"):t("auth_err")):t("auth_sent",{e:email});
});

(async function connect(){
  if(!HOSTED)return;
  let db=null,user=null;
  try{[db,user,AI.sample]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("sample")])}catch(e){}

  else store.role="guest";
  if(db)attachDB(db);
  renderAll()
})();
